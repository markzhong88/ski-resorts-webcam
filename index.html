<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live ski resort webcams ranked by who’s getting snow. Powder radar, favorites, and mountain cams in one view."
    />
    <title>Ski Resort Webcams — Powder Radar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛷️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FCWLVS58N8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FCWLVS58N8');
    </script>
  </head>
  <body>
    <header class="header">
      <h1 class="title">Ski Resort Webcams</h1>
      <p class="subtitle">North American mountain cams, ranked by who’s getting snow</p>

      <section class="powder-board" id="powderBoard" aria-label="Powder radar">
        <div class="powder-board-head">
          <h2 class="powder-title">Powder radar</h2>
          <p class="powder-note">Modeled snowfall (Open-Meteo) — not official resort reports</p>
        </div>
        <div class="powder-list" id="powderList"></div>
      </section>

      <div class="toolbar">
        <label class="toolbar-field">
          <span>Region</span>
          <select id="regionFilter" aria-label="Filter by region">
            <option value="all">All regions</option>
          </select>
        </label>
        <label class="toolbar-field">
          <span>Sort</span>
          <select id="sortBy" aria-label="Sort cams">
            <option value="incoming" selected>Most snow next 48h</option>
            <option value="recent">Most snow last 48h</option>
            <option value="name">Name</option>
            <option value="region">Region</option>
            <option value="default">Default order</option>
          </select>
        </label>
        <label class="toolbar-check">
          <input type="checkbox" id="favoritesOnly" />
          <span>Favorites only</span>
        </label>
        <label class="toolbar-field refresh-label">
          <span>Refresh images</span>
          <select id="refreshInterval" aria-label="Refresh interval">
            <option value="60000">1 min</option>
            <option value="120000">2 min</option>
            <option value="300000" selected>5 min</option>
            <option value="600000">10 min</option>
          </select>
        </label>
        <button type="button" id="refreshNow" class="btn-refresh" title="Refresh all image cams now">
          Refresh now
        </button>
        <span class="result-count" id="resultCount" aria-live="polite"></span>
      </div>
    </header>

    <main class="grid" id="webcamGrid"></main>

    <footer class="footer">
      <p>
        Star cams to build your morning checklist. Snow totals are weather-model estimates via
        <a href="https://open-meteo.com/" rel="noopener noreferrer" target="_blank">Open-Meteo</a>.
      </p>
      <p class="footer-stats">Total visits: <span id="visitCount" aria-live="polite">—</span></p>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
